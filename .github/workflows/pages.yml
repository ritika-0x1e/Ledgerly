name: Deploy to GitHub Pages

# Every push to main checks the code, then publishes the app.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          for f in js/*.js sw.js; do node --check "$f"; done
          cp worker/index.js /tmp/worker.mjs && node --check /tmp/worker.mjs
      - name: Parser test
        run: node test/format.test.js

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html sw.js manifests css js icons _site/
          rm -rf _site/icons/options
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
