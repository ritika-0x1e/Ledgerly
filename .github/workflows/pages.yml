name: Deploy to GitHub Pages

# Every push to main checks the code, then publishes the app.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax check
        run: |
          for f in js/*.js sw.js; do node --check "$f"; done
          cp worker/index.js /tmp/worker.mjs && node --check /tmp/worker.mjs
      - name: Parser test
        run: node test/format.test.js

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html privacy.html sw.js manifests css js icons _site/
          rm -rf _site/icons/options
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # GitHub sometimes can't see the just-uploaded artifact yet ("No artifacts named github-pages"),
      # so if the first deploy fails, wait a little and try once more.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
