# Cloudflare Worker that keeps the Google Drive sign-in (see README, "Google Drive backup").
name = "ledgerly-drive"
main = "index.js"
compatibility_date = "2025-01-01"

[vars]
# Where the app lives (your GitHub Pages address, ending in "/").
APP_URL = "https://ritika-0x1e.github.io/Ledgerly/"

# Make it with: npx wrangler kv namespace create TOKENS   (then paste the id it prints)
[[kv_namespaces]]
binding = "TOKENS"
id = "82c41eb2cbbe4471a16989fc0cd750e1"

# Secrets (not in this file): npx wrangler secret put GOOGLE_CLIENT_ID
#                             npx wrangler secret put GOOGLE_CLIENT_SECRET
