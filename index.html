<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#fdf8ea">   <!-- updated to the screen colour by app.js -->
  <meta name="color-scheme" content="light dark">
  <!-- Drive: the app talks to Google's Drive API and to your sign-in Worker (*.workers.dev).
       If your Worker is on your own domain, add it to connect-src. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self' https://www.googleapis.com https://*.workers.dev; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Ledgerly</title>
  <link rel="manifest" href="manifests/main.webmanifest">
  <link rel="icon" href="icons/icon-rounded.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div id="app" hidden>
    <header>
      <button id="back" class="icon" aria-label="Back" hidden>&#8249;</button>
      <h1 id="title">Expenses</h1>
      <button id="menu-btn" class="icon" aria-label="Menu">&#8942;</button>
      <div id="menu" class="menu" hidden>
        <button id="go-tags" type="button">Tags</button>
        <button id="import" type="button">Import notes (.txt / .csv)</button>
        <button id="export-txt" type="button">Download as text</button>
        <button id="export-csv" type="button">Download as CSV</button>
        <button id="drive-btn" type="button">Connect Google Drive</button>
        <button id="drive-off" type="button" hidden>Disconnect Google Drive</button>
        <button id="currency-btn" type="button">Currency</button>
        <button id="theme-btn" type="button">Theme: System</button>
        <div id="backup-note" class="menu-note"></div>
      </div>
    </header>

    <section id="view-notebook" class="view">
      <div id="nb-page"></div>
    </section>

    <section id="view-tags" class="view" hidden></section>
  </div>

  <input id="import-file" type="file" accept=".txt,.md,.csv,text/plain,text/csv,text/markdown" hidden>

  <dialog id="cur-dialog" class="cur-dialog" aria-labelledby="cur-title">
    <h2 id="cur-title">Which currency do you use?</h2>
    <p class="hint">Shown on the month's total. You can change it later in the menu.</p>
    <input id="cur-search" class="tg-input" placeholder="Search, like pound or GBP" autocomplete="off" aria-label="Search currencies">
    <div id="cur-list" class="cur-list"></div>
    <button id="cur-cancel" type="button" class="tg-btn ghost">Cancel</button>
  </dialog>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-msg"></span>
    <button id="toast-action" type="button" hidden></button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/format.js"></script>
  <script src="js/local.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notebook.js"></script>
  <script src="js/tags.js"></script>
</body>
</html>
